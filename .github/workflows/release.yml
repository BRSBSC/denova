name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release, for example v0.5.0'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  ci:
    name: Require CI for the release commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    outputs:
      run-id: ${{ steps.ci.outputs.run-id }}
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/require-full-ci.sh

  package:
    name: Package ${{ matrix.target }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64, linux-arm64, linux-x64, windows-x64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.ci.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            agent/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: ci-distribution
          run-id: ${{ needs.ci.outputs.run-id }}
          github-token: ${{ github.token }}
      - run: mkdir -p output && tar -xf ci-distribution.tar -C output
      - name: Package the tested frontend for this platform
        env:
          DENOVA_RELEASE_FRONTEND_DIR: ${{ github.workspace }}/output/web
          RELEASE_TARGET: ${{ matrix.target }}
        run: bash scripts/build-github-release.sh "$RELEASE_TAG" "$RELEASE_TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/github-release/denova-${{ env.RELEASE_TAG }}-${{ matrix.target }}.*
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'linux-x64'
        with:
          name: release-metadata
          path: |
            dist/github-release/RELEASE_NOTES.md
            dist/github-release/install.sh

  publish:
    name: Publish verified release assets
    needs: [ci, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/github-release
      - name: Verify the complete platform set and publish
        working-directory: dist/github-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 windows-x64; do
            extension=tar.gz
            if [[ "$target" == windows-x64 ]]; then extension=zip; fi
            test -s "denova-$RELEASE_TAG-$target.$extension"
          done
          sha256sum denova-* > checksums.txt
          # Fork releases must install their own verified packages.
          sed -i "s|REPOSITORY=\"alfredxw/denova\"|REPOSITORY=\"$GITHUB_REPOSITORY\"|" install.sh
          sed -i "s|https://github.com/alfredxw/denova/releases/latest/download/install.sh|https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/install.sh|" RELEASE_NOTES.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Published assets are immutable: replacing them races clients that
            # already pinned this release's checksums.
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]]; then
              echo "Refusing to replace published assets; publish a new version instead." >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
            gh release upload "$RELEASE_TAG" denova-* checksums.txt install.sh --clobber
          else
            gh release create "$RELEASE_TAG" --draft denova-* checksums.txt install.sh --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          # Latest only points to this version once every archive and checksum
          # has finished uploading. Interrupted uploads leave a private draft.
          gh release edit "$RELEASE_TAG" --draft=false

  container:
    name: Publish verified source Docker images
    needs: [ci, package, publish]
    if: github.repository == 'BRSBSC/denova'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.ci.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-linux-*
          merge-multiple: true
          path: dist/github-release
      - name: Prepare verified source bundles for Docker
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            target=linux-x64
            if [[ "$arch" == arm64 ]]; then target=linux-arm64; fi
            mkdir -p "dist/upstream/$arch"
            tar -xzf "dist/github-release/denova-$RELEASE_TAG-$target.tar.gz" -C "dist/upstream/$arch"
            test -x "dist/upstream/$arch/denova/denova"
            test -x "dist/upstream/$arch/denova/denova-updater"
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke-test both source architectures
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker buildx build --load --platform "linux/$arch" \
              --file docker/Dockerfile --tag "denova-source-smoke:$arch" \
              --build-arg "VERSION=$RELEASE_TAG" \
              --build-arg "SOURCE_REPOSITORY=$GITHUB_REPOSITORY" .
            bash docker/smoke-test.sh "denova-source-smoke:$arch" "linux/$arch" "$RELEASE_TAG"
          done
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish tested source version and latest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/brsbsc/denova:${{ env.RELEASE_TAG }}
            ghcr.io/brsbsc/denova:latest
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
            SOURCE_REPOSITORY=${{ github.repository }}
          labels: |
            org.opencontainers.image.revision=${{ needs.ci.outputs.sha }}
      - name: Report source publication
        run: |
          echo 'Published ghcr.io/brsbsc/denova:${{ env.RELEASE_TAG }} and latest from verified source.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source: ${{ needs.ci.outputs.sha }}; platforms: linux/amd64, linux/arm64.' >> "$GITHUB_STEP_SUMMARY"
