name: Sync upstream release and publish GHCR

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream stable tag (empty means latest)"
        type: string
        default: ""
      force:
        description: "Rebuild an already mirrored release"
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - ".github/workflows/sync-upstream-release.yml"
      - "docker/**"
      - "scripts/sync_upstream_release.py"
      - "scripts/test_sync_upstream_release.py"
  pull_request:
    paths:
      - ".github/workflows/sync-upstream-release.yml"
      - "docker/**"
      - "scripts/sync_upstream_release.py"
      - "scripts/test_sync_upstream_release.py"

permissions:
  contents: read

# Do not interrupt a publication midway or let two runs move latest concurrently.
concurrency:
  group: upstream-release-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.event.number || 'publish' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test release verification and container initialization
        run: |
          python3 -B -m unittest discover -s scripts -p test_sync_upstream_release.py
          python3 -B -m unittest discover -s docker -p test_entrypoint.py
          bash -n docker/smoke-test.sh

  mirror:
    needs: verify
    if: github.repository == 'BRSBSC/denova' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Check upstream and verify release bundles
        id: upstream
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          FORCE_REBUILD: ${{ inputs.force || github.event_name == 'push' }}
        run: |
          args=()
          if [[ "${FORCE_REBUILD}" == "true" ]]; then args+=(--force); fi
          python3 -B scripts/sync_upstream_release.py prepare \
            --repository "${GITHUB_REPOSITORY}" --tag "${REQUESTED_TAG}" "${args[@]}"

      - name: Set up QEMU
        if: steps.upstream.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        if: steps.upstream.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build and smoke-test both architectures
        if: steps.upstream.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            docker buildx build --load --platform "linux/${arch}" \
              --file docker/Dockerfile --tag "denova-smoke:${arch}" \
              --build-arg "VERSION=${VERSION}" \
              --build-arg "SOURCE_REPOSITORY=${GITHUB_REPOSITORY}" .
            bash docker/smoke-test.sh "denova-smoke:${arch}" "linux/${arch}" "${VERSION}"
          done
      - name: Log in to GHCR
        if: steps.upstream.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish tested multi-platform version
        if: steps.upstream.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.upstream.outputs.image }}:${{ steps.upstream.outputs.version }}
          build-args: |
            VERSION=${{ steps.upstream.outputs.version }}
            SOURCE_REPOSITORY=${{ github.repository }}
      - name: Mirror release assets and promote latest
        if: steps.upstream.outputs.changed == 'true'
        run: python3 -B scripts/sync_upstream_release.py finish --repository "${GITHUB_REPOSITORY}"
      - name: Report result
        env:
          CHANGED: ${{ steps.upstream.outputs.changed }}
          VERSION: ${{ steps.upstream.outputs.version }}
          IMAGE: ${{ steps.upstream.outputs.image }}
        run: |
          if [[ "${CHANGED}" == "true" ]]; then
            echo "Published ${IMAGE}:${VERSION} and mirrored upstream release assets." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Upstream ${VERSION} is already mirrored. No changes needed." >> "${GITHUB_STEP_SUMMARY}"
          fi
